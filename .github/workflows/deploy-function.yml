name: Deploy Azure Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Function App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Verify function entrypoint
        run: |
          if (!(Test-Path "dist/src/index.js")) {
            throw "Missing dist/src/index.js"
          }
          if (!(Test-Path "dist/src/functions/processDocument.js")) {
            throw "Missing dist/src/functions/processDocument.js"
          }
          node -e "console.log(require('./package.json').main); require('./dist/src/index.js')"

      - name: Keep production dependencies only
        run: npm prune --omit=dev

      - name: Verify production dependency package
        run: |
          if (!(Test-Path "node_modules/cookie")) {
            throw "Missing node_modules/cookie"
          }
          if (!(Test-Path "node_modules/@azure/functions")) {
            throw "Missing node_modules/@azure/functions"
          }
          if (!(Test-Path "node_modules/.prisma/client")) {
            throw "Missing generated Prisma client"
          }

      - name: Upload Function artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: |
            .
            !.git
            !.github
            !local.settings.json
            !.env
            !*.log

  deploy:
    name: Deploy Function App
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download Function artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: function-app

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: docprocess-funcapp
          package: function-app
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
