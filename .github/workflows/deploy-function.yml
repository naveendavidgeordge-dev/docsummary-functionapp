name: Deploy Azure Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy Function App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify function entrypoint
        run: |
          if (!(Test-Path "dist/src/index.js")) {
            throw "Missing dist/src/index.js"
          }
          if (!(Test-Path "dist/src/functions/processDocument.js")) {
            throw "Missing dist/src/functions/processDocument.js"
          }
          node -e "console.log(require('./package.json').main); require('./dist/src/index.js')"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: docprocess-funcapp
          package: .
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
